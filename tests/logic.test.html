<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분수 키친 논리 테스트</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { overflow: auto; height: auto; position: static; background: #fffdf6; }
  body { padding: 16px; font-size: 15px; color: #2b2b2b; }
  h1 { font-size: 22px; }
  #summary { padding: 10px 14px; border-radius: 8px; font-size: 18px; margin: 12px 0; }
  .pass { background: #d9f5df; } .fail { background: #fbd5d2; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: middle; }
  th { background: #f0eddf; }
  .fv-expr { white-space: nowrap; }
  .sentence { line-height: 2.5; }
</style>
</head>
<body>
<h1>분수 키친 논리 테스트</h1>
<div id="summary">실행 중…</div>
<div id="units"></div>
<div id="tables"></div>
<script type="module">
import { frac, fromMixed, toMixed, add, sub, mul, div, eq, cmp, isReduced } from '../js/fraction.js';
import { TYPES, TYPE_NAMES, makeProblem, pickTarget, amountFromAnswer } from '../js/problems.js';
import { makeOrder, seededRng } from '../js/orders.js';
import { serveScore, starsFor } from '../js/scoring.js';
import { judge, potState, newStations, useA, getHint } from '../js/game/stations.js';
import { STAGES } from '../js/stages.js';
import { activeOrders, applyUse, autoGroup, decode, encode, needsTick, startingGame, takeIngredient, tickOrders } from '../js/game/teamState.js';
import { CONFIG } from '../js/config.js';
import { partsHTML, fracHTML } from '../js/ui/fracview.js';

let passed = 0, failed = 0;
const fails = [];
function ok(name, cond) {
  if (cond) passed++; else { failed++; fails.push(name); }
}
const same = (a, b) => a.n === b.n && a.d === b.d;

// 분수
ok('약분', same(frac(6, 8), { n: 3, d: 4 }));
ok('음수 분모', same(frac(1, -2), { n: -1, d: 2 }));
ok('대분수', same(fromMixed(2, 1, 4), { n: 9, d: 4 }));
ok('대분수로', JSON.stringify(toMixed(frac(9, 4))) === '{"w":2,"n":1,"d":4}');
ok('덧셈', same(add(frac(3, 8), frac(3, 8)), frac(3, 4)));
ok('뺄셈', same(sub(frac(3, 4), frac(1, 4)), frac(1, 2)));
ok('곱셈', same(mul(frac(2, 3), frac(5, 4)), frac(5, 6)));
ok('나눗셈', same(div(frac(3, 4), frac(3, 8)), frac(2)));
ok('같음', eq(frac(6, 8), frac(3, 4)));
ok('비교', cmp(frac(1, 2), frac(2, 3)) === -1);
ok('기약 판단', isReduced(3, 4) && !isReduced(6, 8));

// 기획서 표의 예시
const fixed = seededRng(1);
for (const [type, sem, target] of [
  ['s1-a', 1, frac(3, 4)], ['s1-b', 1, frac(7, 3)], ['s1-c', 1, frac(2, 7)], ['s1-d', 1, frac(3, 8)],
  ['s1-e', 1, frac(3, 5)], ['s1-f', 1, frac(3, 4)], ['s2-a', 2, frac(6, 7)], ['s2-b', 2, frac(5, 9)],
  ['s2-c', 2, frac(3, 4)], ['s2-d', 2, frac(6)], ['s2-e', 2, frac(5, 6)], ['s2-f', 2, frac(3, 2)],
]) {
  ok(`기획서 예시 ${type}`, makeProblem(sem, type, target, { rng: fixed }) !== null);
}

// 주문: 시드가 같으면 같다
const orderOpts = { semester: 1, types: TYPES[1], dishes: STAGES[1].dishes };
ok('주문 재현', JSON.stringify(makeOrder(42, 3, orderOpts)) === JSON.stringify(makeOrder(42, 3, orderOpts)));
ok('주문 다름', JSON.stringify(makeOrder(42, 3, orderOpts)) !== JSON.stringify(makeOrder(43, 3, orderOpts)));

// 점수
ok('2종 서빙 + 팁 20', serveScore(2, 0.6).total === 60);
ok('3종 서빙 + 팁 10', serveScore(3, 0.3).total === 70);
ok('팁 없음', serveScore(2, 0.1).total === 40);
ok('별', starsFor(1, 119) === 0 && starsFor(1, 120) === 1 && starsFor(1, 360) === 3);

// 판정
const order = { id: 'o', dish: '떡볶이', lines: [
  { ingredient: '떡', amount: frac(3, 4) }, { ingredient: '고추장 소스', amount: frac(1, 2) } ] };
ok('빈 냄비', judge({}, [order]).status === 'empty');
ok('덜 들어감', judge({ 떡: frac(3, 8) }, [order]).status === 'yellow');
ok('딱 맞음', judge({ 떡: frac(3, 4), '고추장 소스': frac(1, 2) }, [order]).status === 'green');
ok('많음', judge({ 떡: frac(7, 8) }, [order]).status === 'red');
ok('다른 재료', judge({ 어묵: frac(1, 8) }, [order]).status === 'red');

// 8분의 3을 두 번 넣어도 정답
{
  const stations = newStations(STAGES[1]);
  const stove = Object.values(stations).find((s) => s.type === 'stove');
  const ctx = (hand) => ({ hand, orders: [order], now: 1000 });
  useA(stove, ctx({ kind: 'ingredient', ingredient: '떡', amount: frac(3, 8) }));
  useA(stove, ctx({ kind: 'ingredient', ingredient: '떡', amount: frac(3, 8) }));
  ok('두 번 더해 노랑', potState(stove.pot, [order], 1000).status === 'yellow');
  useA(stove, ctx({ kind: 'ingredient', ingredient: '고추장 소스', amount: frac(1, 2) }));
  ok('맞으면 끓기 시작', potState(stove.pot, [order], 1000).status === 'cooking');
  ok('다 익음', potState(stove.pot, [order], 1000 + CONFIG.COOK_MS).status === 'done');
  ok('탐', potState(stove.pot, [order], 1000 + CONFIG.COOK_MS + CONFIG.BURN_AFTER_MS).status === 'burnt');
  const plated = useA(stove, { hand: { kind: 'plate', meal: null }, orders: [order], now: 1000 + CONFIG.COOK_MS + 1 });
  ok('접시에 담기', plated.hand.meal?.dish === '떡볶이');
  const serveStation = Object.values(stations).find((s) => s.type === 'serve');
  ok('서빙', useA(serveStation, { hand: plated.hand, orders: [order], now: 0 }).served === order);
}

// 같은 요리 주문이 둘이면 재료를 번갈아 맡고, 지금 할 일을 알려 준다
{
  const line = (ingredient, amount) => ({ ingredient, amount });
  const a = { id: 'a', dish: '떡볶이', lines: [line('떡', frac(3, 4)), line('고추장 소스', frac(1, 2))] };
  const b = { id: 'b', dish: '떡볶이', lines: [line('떡', frac(2, 3)), line('고추장 소스', frac(1, 3))] };
  const orders = [a, b];
  const stations = newStations(STAGES[1]);
  const crate = Object.values(stations).find((s) => s.ingredient === '떡');
  const stoves = Object.values(stations).filter((s) => s.type === 'stove');
  const plates = Object.values(stations).find((s) => s.type === 'plates');
  const base = { orders, now: 0, stations };

  const open1 = useA(crate, { ...base, hand: null });
  ok('첫 재료는 오래된 주문', open1.openPantry?.order === a);
  ok('처음 할 일은 재료 상자', getHint({ ...base, hand: null }).target === crate.id);
  const hand1 = { kind: 'ingredient', ingredient: '떡', unit: 'kg', amount: frac(3, 4) };
  ok('재료를 들면 냄비로 안내', stations[getHint({ ...base, hand: hand1 }).target].type === 'stove');
  useA(stoves[0], { ...base, hand: hand1 });
  ok('같은 재료의 다음은 다음 주문', useA(crate, { ...base, hand: null }).openPantry?.order === b);
  const hand2 = { kind: 'ingredient', ingredient: '떡', unit: 'kg', amount: frac(2, 3) };
  useA(stoves[1], { ...base, hand: hand2 });
  const none = useA(crate, { ...base, hand: null });
  ok('충분하면 더 안 꺼냄', !none.openPantry && !!none.message);
  const sauce = Object.values(stations).find((s) => s.ingredient === '고추장 소스');
  ok('다음 재료로 안내', getHint({ ...base, hand: null }).target === sauce.id);
  stoves[0].pot.contents['고추장 소스'] = frac(1, 2);
  stoves[0].pot.cookStart = 0;
  ok('끓는 동안 접시로 안내', getHint({ ...base, hand: null }).target === plates.id);
  stoves[0].pot.cookStart = -CONFIG.COOK_MS;
  ok('완성되면 접시로 안내', getHint({ ...base, hand: null }).target === plates.id);
  const wrong = { kind: 'ingredient', ingredient: '떡', unit: 'kg', amount: frac(9) };
  ok('틀린 양은 버리기로 안내', stations[getHint({ ...base, hand: wrong }).target].type === 'trash');
}

// 모둠 공유 상태: Firebase에 저장했다 읽어도 그대로이고, 두 명이 같은 물건을 집지 못한다
{
  const stage = STAGES[1];
  // Firebase처럼 null과 빈 객체를 없앤다
  const firebaseLike = (v) => {
    if (v === null || v === undefined) return null;
    if (typeof v !== 'object') return v;
    const out = {};
    for (const [k, x] of Object.entries(v)) {
      const c = firebaseLike(x);
      if (c !== null) out[k] = c;
    }
    return Object.keys(out).length ? out : null;
  };
  const roundTrip = (g) => decode(firebaseLike(encode(g)), stage);
  const ctx = { seed: 5, semester: 1, types: TYPES[1], dishes: stage.dishes };

  const g0 = decode(firebaseLike(startingGame(stage, 1000)), stage);
  ok('시작 주문 2개', activeOrders(g0, ctx).length === 2);
  ok('시작 주문 시각', activeOrders(g0, ctx)[0].startAt === 1000);
  const other = decode(firebaseLike(startingGame(stage, 1000)), stage);
  ok('두 모둠의 주문이 같음', JSON.stringify(activeOrders(g0, ctx)) === JSON.stringify(activeOrders(other, ctx)));

  const stove = Object.values(g0.stations).find((s) => s.type === 'stove');
  const counter = Object.values(g0.stations).find((s) => s.type === 'counter');
  const plates = Object.values(g0.stations).find((s) => s.type === 'plates');
  ok('빈 냄비 유지', roundTrip(g0).stations[stove.id].pot?.cookStart === null);
  applyUse(g0, 'a', stove.id, 2000, ctx);
  stove.pot.contents = { 떡: frac(3, 4) };
  ok('냄비 내용 유지', eq(roundTrip(g0).stations[stove.id].pot.contents['떡'], frac(3, 4)));
  stove.pot = null;
  ok('냄비 없음 유지', roundTrip(g0).stations[stove.id].pot === null);
  stove.pot = { contents: {}, cookStart: null };

  // 접시 집기와 놓기, 다른 사람과 나누기
  const shared = roundTrip(g0);
  ok('접시 집기', applyUse(shared, 'a', plates.id, 2000, ctx).changed && shared.hands.a.kind === 'plate');
  const saved = roundTrip(shared);
  ok('손도 저장됨', saved.hands.a.kind === 'plate' && saved.hands.a.meal === null);
  applyUse(saved, 'a', counter.id, 2000, ctx);
  ok('조리대에 놓기', saved.stations[counter.id].item?.kind === 'plate' && !saved.hands.a);
  const race = roundTrip(saved);
  applyUse(race, 'a', counter.id, 2000, ctx);
  applyUse(race, 'b', counter.id, 2000, ctx);
  ok('한 명만 집음', race.hands.a?.kind === 'plate' && !race.hands.b);

  ok('손이 차면 재료 안 받음', !takeIngredient(race, 'a', { ingredient: '떡', unit: 'kg', amount: frac(1, 2), correct: true }).changed);
  const score0 = race.score;
  ok('재료 받기', takeIngredient(race, 'c', { ingredient: '떡', unit: 'kg', amount: frac(1, 2), correct: true }).changed);
  ok('정답 점수', race.score === score0 + CONFIG.SCORE_PANTRY_CORRECT);

  // 주문 시간 초과와 새 주문
  const t = roundTrip(g0);
  const late = 1000 + CONFIG.ORDER_MS;
  ok('시간 확인 필요', needsTick(t, late, ctx, 2));
  const before = t.score;
  ok('시간 초과 2개', tickOrders(t, late, ctx, 2).expired === 2);
  ok('시간 초과 감점', t.score === before + 2 * CONFIG.SCORE_TIMEOUT);
  ok('곧 새 주문', t.orders.dueAt === late + CONFIG.ORDER_GAP_MS);
  tickOrders(t, t.orders.dueAt, ctx, 2);
  ok('새 주문', activeOrders(t, ctx)[0].id === 'o2');

  // 모둠 편성
  const uids = Array.from({ length: 25 }, (_, i) => `u${i}`);
  const sizes = (groups) => {
    const c = {};
    Object.values(groups).forEach((g) => { c[g.teamId] = (c[g.teamId] ?? 0) + 1; });
    return Object.values(c);
  };
  for (const size of [2, 3, 4, 5]) {
    const s = sizes(autoGroup(uids, size));
    ok(`${size}명씩 편성: 12모둠 이내`, s.length <= CONFIG.TEAM_LIMIT);
    ok(`${size}명씩 편성: 고른 인원`, Math.max(...s) - Math.min(...s) <= 1 && Math.min(...s) >= 2 && Math.max(...s) <= 5);
  }
  ok('한 명도 편성', sizes(autoGroup(['x'], 4))[0] === 1);
  const g5 = autoGroup(['a', 'b', 'c', 'd', 'e'], 5);
  ok('색이 겹치지 않음', new Set(Object.values(g5).map((g) => g.color)).size === 5);
}

// 유형마다 20문제
const tables = document.getElementById('tables');
const slashFree = (parts) => parts.every((p) => typeof p !== 'string' || !/\d\s*\/\s*\d/.test(p));
// '○ kg 컵', '몇 번 퍼 담을까요'처럼 어색한 표현이 다시 들어오지 않게 막는다.
const naturalWording = (parts) => parts.every((p) => typeof p !== 'string' || !/(kg|L)(짜리)? (컵|묶음)|퍼 담/.test(p));
const unitFits = (p) => p.answerKind !== 'count' || (p.answer.d === 1 ? p.countUnit !== '배' : p.countUnit === '배');
const inRange = (f, sem) => f.d <= (sem === 1 ? CONFIG.S1_MAX_DENOM : CONFIG.S2_MAX_DENOM);
for (const sem of [1, 2]) {
  for (const type of TYPES[sem]) {
    const rng = seededRng(type.charCodeAt(1) * 1000 + type.charCodeAt(3));
    let rows = '';
    let good = 0;
    for (let k = 0; k < 20; k++) {
      const target = pickTarget(sem, type, rng);
      const p = makeProblem(sem, type, target, { rng });
      const valid = p && eq(amountFromAnswer(p, p.answer), target) && slashFree(p.parts) && naturalWording(p.parts) && unitFits(p) && inRange(target, sem);
      ok(`${type} #${k}`, valid);
      if (valid) good++;
      rows += `<tr><td>${k + 1}</td><td class="sentence">${partsHTML(p.parts)}</td>
        <td class="fv-expr">${partsHTML(p.expr)}</td>
        <td>${fracHTML(amountFromAnswer(p, p.answer), p.unit)}</td>
        <td>${valid ? '통과' : '실패'}</td></tr>`;
    }
    tables.insertAdjacentHTML('beforeend', `<h2>${type} ${TYPE_NAMES[type]} (${good}/20)</h2>
      <table><tr><th>#</th><th>문제</th><th>식과 답</th><th>꺼내는 양</th><th>검증</th></tr>${rows}</table>`);
  }
}

const s = document.getElementById('summary');
s.className = failed ? 'fail' : 'pass';
s.textContent = failed ? `실패 ${failed}개 / 통과 ${passed}개` : `모두 통과 (${passed}개)`;
document.getElementById('units').textContent = fails.join(', ');
window.__result = { passed, failed, fails };
</script>
</body>
</html>
